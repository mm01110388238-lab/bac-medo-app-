<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشروحات</title>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; text-align: center; }
        .container { max-width: 650px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 16px; text-align: right; }
        .section-box { background: #0f172a; padding: 15px; border-radius: 12px; margin-bottom: 20px; border-right: 4px solid #38bdf8; }
        .section-title { color: #38bdf8; font-size: 18px; margin-top: 0; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        .btn-item { display: block; background: #334155; color: #f8fafc; padding: 12px; margin: 8px 0; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.2s; }
        .btn-item:hover { background: #475569; color: #38bdf8; }
        .btn-back { display: inline-block; background: #64748b; color: white; padding: 8px 20px; border-radius: 8px; text-decoration: none; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: #38bdf8; text-align: center; font-size: 22px;">📚 {{ title }}</h1>
        
        {% if grouped_lessons %}
            {% for section_name, items in grouped_lessons.items() %}
                <div class="section-box">
                    <h2 class="section-title">📌 {{ section_name }}</h2>
                    {% for item in items %}
                        <a href="{{ item.link }}" target="_blank" class="btn-item">▶ {{ item.title }}</a>
                    {% endfor %}
                </div>
            {% endfor %}
        {% else %}
            <p style="color: #94a3b8; text-align: center;">لا توجد شروحات مضافة لهذا المسار حالياً.</p>
        {% endif %}

        <div style="text-align: center;">
            <a href="/tracks" class="btn-back">⬅ اختيار مسار آخر</a>
        </div>
    </div>
</body>
</html>
