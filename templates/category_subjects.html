<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ cat_title }} - منصة السعيد التعليمية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-bottom: 40px;
        }
        .header-box {
            background: linear-gradient(135deg, #1e1e1e, #2a2a2a);
            border-bottom: 2px solid #00ffcc;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        .section-title {
            color: #00ffcc;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-right: 4px solid #00ffcc;
            padding-right: 10px;
        }
        .subject-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 18px;
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }
        .subject-card:hover {
            transform: translateY(-3px);
            border-color: #00ffcc;
            color: #00ffcc;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.15);
        }
        .track-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #00ffcc;
        }
        .btn-back {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 8px 16px;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-back:hover {
            background-color: #333;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="header-box text-center">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 m-0 font-weight-bold">{{ cat_title }}</h1>
            <a href="{{ url_for('index') }}" class="btn-back">⬅ العودة للرئيسية</a>
        </div>
    </div>

    <div class="container">
        <!-- قسم المواد الأساسية -->
        <div class="mb-5">
            <div class="section-title">📚 المواد الأساسية (العامة)</div>
            <div class="row g-3">
                {% for sub_id, sub_name in general_subjects.items() %}
                <div class="col-md-4 col-sm-6">
                    <a href="{{ url_for('general_items', cat_type=cat_type, subject_id=sub_id) }}" class="subject-card">
                        <span>📖 {{ sub_name }}</span>
                        <span>←</span>
                    </a>
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- قسم المسار التخصصي الخاص بالطالب -->
        <div>
            <div class="section-title">🚀 موادي التخصصية</div>
            <div class="row g-3">
                <div class="col-12">
                    <a href="{{ url_for('specialized_items', cat_type=cat_type, track_id=user_track) }}" class="subject-card track-card">
                        <div>
                            <span class="d-block text-muted small">مسارك المسجل:</span>
                            <strong class="fs-5 text-info">🎯 {{ track_name }}</strong>
                        </div>
                        <span class="fs-4 text-info">←</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
