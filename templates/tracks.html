<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if cat_title %}{{ cat_title }} - {% endif %}اختر المسار والتخصص - منصة السعيد</title>

    <!-- أيقونة الموقع (Favicon) -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --shadow: rgba(0, 0, 0, 0.4);
            --item-bg: #0f172a;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #0284c7;
            --shadow: rgba(0, 0, 0, 0.08);
            --item-bg: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, 'Segoe UI', sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; min-height: 100vh; position: relative; }
        
        /* الهيدر العلوي */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: 0 2px 10px var(--shadow);
        }

        .btn-back { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            background: var(--border-color); 
            color: var(--text-color); 
            padding: 8px 16px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 14px; 
            transition: 0.2s ease;
        }

        .btn-back:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .theme-toggle-btn { 
            background: none; 
            border: 1px solid var(--border-color); 
            color: var(--text-color); 
            padding: 8px 12px; 
            border-radius: 8px; 
            cursor: pointer; 
        }

        /* الحاوية الرئيسية */
        .container { 
            max-width: 550px; 
            margin: 75px auto 40px auto; 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 4px 12px var(--shadow); 
            text-align: right; 
        }

        .page-header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .page-title { 
            color: var(--accent-color); 
            font-size: 20px; 
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-track {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--item-bg);
            color: var(--text-color);
            padding: 16px 20px;
            margin: 12px 0;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid var(--border-color);
            font-size: 15px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .btn-track:hover {
            transform: translateX(-4px);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .btn-track-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-track i.arrow-icon {
            color: var(--accent-color);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <header class="top-navbar">
        {% if cat_type %}
            <a href="{{ url_for('select_type', cat_type=cat_type) }}" class="btn-back">
                <i class="fa-solid fa-arrow-right"></i> رجوع
            </a>
        {% else %}
            <a href="{{ url_for('index') }}" class="btn-back">
                <i class="fa-solid fa-house"></i> الرئيسية
            </a>
        {% endif %}
        <button class="theme-toggle-btn" onclick="toggleTheme()" title="تغيير المظهر">
            <i class="fa-solid fa-moon" id="theme-icon"></i>
        </button>
    </header>

    <!-- المحتوى الرئيسي -->
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">
                <i class="fa-solid fa-graduation-cap"></i> 
                {% if cat_title %}{{ cat_title }} - {% endif %}اختر المسار والتخصص
            </h1>
        </div>
        
        {% for key, name in tracks.items() %}
            {% if cat_type %}
                <a href="{{ url_for('specialized_items', cat_type=cat_type, track_id=key) }}" class="btn-track">
            {% else %}
                <a href="{{ url_for('lessons', track_id=key) }}" class="btn-track">
            {% endif %}
                <div class="btn-track-info">
                    <i class="fa-solid fa-bookmark" style="color: var(--accent-color);"></i>
                    <span>{{ name }}</span>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>
        {% endfor %}
    </div>

    <script>
        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('theme-icon');
            icon.className = theme === 'light' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);
    </script>
</body>
</html>
