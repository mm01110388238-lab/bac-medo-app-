<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المواد الأساسية - {{ cat_title }}</title>
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #0284c7;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, 'Segoe UI', sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; text-align: center; min-height: 100vh; position: relative; }
        .container { max-width: 650px; margin: 0 auto; padding-top: 70px; }

        /* الهيدر العلوي */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: 0 2px 10px var(--shadow);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .theme-toggle-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* شريحة العناوين */
        .header-badge {
            display: inline-block;
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .page-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 25px;
        }

        /* شبكة المواد */
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            text-align: right;
        }

        .subject-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-right: 4px solid var(--accent-color);
            border-radius: 14px;
            padding: 16px 18px;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 12px var(--shadow);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .subject-card:hover {
            transform: translateX(-4px);
            border-color: var(--accent-color);
        }

        .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .subject-info h3 {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
            color: var(--text-color);
        }

        .subject-info p {
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <header class="top-navbar">
        <a href="{{ url_for('select_type', cat_type=cat_type) }}" class="btn-back">
            <i class="fa-solid fa-arrow-right"></i> رجوع
        </a>
        <button class="theme-toggle-btn" onclick="toggleTheme()">
            <i class="fa-solid fa-moon" id="theme-icon"></i>
        </button>
    </header>

    <!-- المحتوى الرئيسي -->
    <div class="container">
        <span class="header-badge">{{ cat_title }}</span>
        <h1 class="page-title">المواد الأساسية لجميع المسارات</h1>

        <div class="subjects-grid">
            {% for sub_id, sub_name in subjects.items() %}
            <a href="{{ url_for('general_items', cat_type=cat_type, subject_id=sub_id) }}" class="subject-card">
                <div class="icon-box">
                    <i class="fa-solid fa-book-bookmark"></i>
                </div>
                <div class="subject-info">
                    <h3>{{ sub_name }}</h3>
                    <p>عرض محتوى {{ cat_title }}</p>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>

    <script>
        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeUI(newTheme);
        }

        function updateThemeUI(theme) {
            const icon = document.getElementById('theme-icon');
            if (theme === 'light') {
                icon.className = 'fa-solid fa-sun';
            } else {
                icon.className = 'fa-solid fa-moon';
            }
        }

        // تطبيق الثيم المحفوظ
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
        updateThemeUI(savedTheme);
    </script>
</body>
</html>
