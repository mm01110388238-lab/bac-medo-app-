<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصات التعليمية - سهلتها لك</title>
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --shadow: rgba(0, 0, 0, 0.4);
            --item-bg: #0f172a;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #0284c7;
            --shadow: rgba(0, 0, 0, 0.08);
            --item-bg: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, 'Segoe UI', sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; text-align: center; min-height: 100vh; }

        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 20px auto;
            padding: 10px 5px;
        }

        .btn-back { display: inline-flex; align-items: center; gap: 8px; background: var(--border-color); color: var(--text-color); padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .theme-toggle-btn { background: none; border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 12px; border-radius: 8px; cursor: pointer; }

        .container { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 25px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 12px var(--shadow); text-align: right; }

        h1 { color: var(--accent-color); text-align: center; font-size: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 20px; }

        .btn-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--item-bg);
            color: var(--text-color);
            padding: 16px;
            margin: 12px 0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid var(--border-color);
            font-size: 15px;
        }

        .btn-item:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .btn-item i.external-icon {
            color: var(--accent-color);
            font-size: 14px;
        }

        .empty-msg {
            color: var(--text-muted);
            text-align: center;
            font-size: 14px;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="top-navbar">
        <a href="/" class="btn-back"><i class="fa-solid fa-house"></i> الرئيسية</a>
        <button class="theme-toggle-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon" id="theme-icon"></i></button>
    </div>

    <div class="container">
        <h1>🌐 المنصات التعليمية</h1>
        {% if platforms %}
            {% for p in platforms %}
                <a href="{{ p.link }}" target="_blank" class="btn-item">
                    <span>🚀 {{ p.title }}</span>
                    <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
                </a>
            {% endfor %}
        {% else %}
            <p class="empty-msg">لا توجد منصات مضافة حالياً.</p>
        {% endif %}
    </div>

    <script>
        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('theme-icon');
            icon.className = theme === 'light' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);
    </script>
</body>
</html>
