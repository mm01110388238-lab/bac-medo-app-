<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else 'المذكرات والتلخيصات - منصة السعيد' }}</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --item-bg: rgba(15, 23, 42, 0.6);
            --item-hover: rgba(56, 189, 248, 0.08);
            --shadow: rgba(0, 0, 0, 0.35);
            --badge-bg: rgba(56, 189, 248, 0.15);
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(0, 0, 0, 0.08);
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --item-bg: #ffffff;
            --item-hover: rgba(2, 132, 199, 0.05);
            --shadow: rgba(0, 0, 0, 0.06);
            --badge-bg: rgba(2, 132, 199, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 650px;
            margin-bottom: 20px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            color: var(--text-color);
            padding: 9px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px var(--shadow);
            backdrop-filter: blur(8px);
        }

        .btn-back:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .theme-toggle-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 10px var(--shadow);
            backdrop-filter: blur(8px);
        }

        .theme-toggle-btn:hover {
            transform: translateY(-2px);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 28px 22px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px var(--shadow);
            backdrop-filter: blur(12px);
            text-align: right;
        }

        .header-box {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
        }

        .header-icon {
            width: 55px;
            height: 55px;
            background: var(--badge-bg);
            color: var(--accent-color);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 12px;
        }

        h1 {
            color: var(--text-color);
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
        }

        /* شريط البحث السريع */
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 42px 12px 15px;
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--badge-bg);
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
        }

        .summaries-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .summary-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--item-bg);
            color: var(--text-color);
            padding: 16px 18px;
            border-radius: 14px;
            text-decoration: none;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .summary-card::before {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--accent-color);
            border-radius: 0 14px 14px 0;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .summary-card:hover {
            border-color: var(--accent-color);
            background: var(--item-hover);
            transform: translateX(-4px);
        }

        .summary-card:hover::before {
            opacity: 1;
        }

        .card-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .file-icon-box {
            width: 42px;
            height: 42px;
            background: var(--badge-bg);
            color: var(--accent-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .item-title {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text-color);
        }

        .download-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--badge-bg);
            color: var(--accent-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .summary-card:hover .download-btn {
            background: var(--accent-color);
            color: #ffffff;
        }

        .empty-box {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-box i {
            font-size: 45px;
            margin-bottom: 15px;
            opacity: 0.5;
            color: var(--text-muted);
        }

        .empty-box p {
            font-size: 15px;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .container { padding: 20px 15px; }
            .summary-card { padding: 14px; }
            .download-btn span { display: none; }
            .download-btn { padding: 8px 10px; }
        }
    </style>
</head>
<body>

    <div class="top-navbar">
        <a href="{{ back_url if back_url else url_for('index') }}" class="btn-back">
            <i class="fa-solid fa-arrow-right"></i> العودة
        </a>
        <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="تبديل المظهر">
            <i class="fa-solid fa-moon" id="theme-icon"></i>
        </button>
    </div>

    <div class="container">
        <div class="header-box">
            <div class="header-icon">
                <i class="fa-solid fa-file-signature"></i>
            </div>
            <h1>{{ title if title else '📝 المذكرات والتلخيصات' }}</h1>
            <p class="subtitle">ملخصات شاملة ومذكرات مركزة لمساعدتك في المذاكرة والمراجعة السريعة</p>
        </div>

        {% if summaries %}
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" onkeyup="filterSummaries()" placeholder="ابحث عن اسم المذكرة أو الدرس...">
            </div>

            <div class="summaries-list" id="summariesList">
                {% for s in summaries %}
                    <a href="{{ s.link }}" target="_blank" class="summary-card">
                        <div class="card-right">
                            <div class="file-icon-box">
                                <i class="fa-solid fa-file-pdf"></i>
                            </div>
                            <span class="item-title">{{ s.title }}</span>
                        </div>
                        <div class="download-btn">
                            <i class="fa-solid fa-download"></i>
                            <span>فتح / تحميل</span>
                        </div>
                    </a>
                {% endfor %}
            </div>
        {% else %}
            <div class="empty-box">
                <i class="fa-solid fa-folder-open"></i>
                <p>لا توجد مذكرات أو تلخيصات مضافة في هذا القسم حالياً.</p>
            </div>
        {% endif %}
    </div>

    <script>
        // البحث الفوري في قائمة المذكرات
        function filterSummaries() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase();
            const list = document.getElementById('summariesList');
            const cards = list.getElementsByClassName('summary-card');

            for (let i = 0; i < cards.length; i++) {
                const title = cards[i].querySelector('.item-title').textContent || cards[i].querySelector('.item-title').innerText;
                if (title.toLowerCase().indexOf(filter) > -1) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        // إداراة المظهر (الداكن والفتح)
        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('theme-icon');
            icon.className = theme === 'light' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);
    </script>
</body>
</html>
