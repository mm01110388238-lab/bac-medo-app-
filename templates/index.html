<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-J04WRJG1B7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-J04WRJG1B7');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070c18">
    <title>مَـنـصَّـة السَّـعـيـد - الرئيسية</title>

    <!-- ملف Web Manifest للتطبيقات PWA -->
    <link rel="manifest" href="{{ url_for('manifest') }}">

    <!-- أيقونة الموقع (Favicon) واللوجو -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}?v=99">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}?v=99">

    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #080d1a;
            --card-bg: #111827;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --accent-color: #00d2ff;
            --neon-blue: #00f0ff;
            --shadow: rgba(0, 0, 0, 0.6);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 12px; 
            padding-top: 80px;
            padding-bottom: 20px;
            min-height: 100vh; 
        }

        .container { 
            max-width: 500px; 
            margin: 0 auto; 
        }

        /* شريط التنقل النيون العلوي/المثبت */
        .neon-navbar {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 480px;
            height: 62px;
            background: rgba(10, 18, 38, 0.85);
            backdrop-filter: blur(12px);
            border: 1.5px solid #1a3862;
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.25), inset 0 0 10px rgba(0, 162, 255, 0.1);
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 1000;
            padding: 0 10px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #7dd3fc;
            font-size: 11px;
            font-weight: bold;
            gap: 3px;
            flex: 1;
            transition: all 0.3s ease;
        }

        .nav-item i {
            font-size: 20px;
            filter: drop-shadow(0 0 6px rgba(0, 210, 255, 0.6));
        }

        /* الزر الأوسط (الرئيسية) */
        .nav-item.active {
            position: relative;
            color: #ffffff;
        }

        .home-icon-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px #00d2ff, inset 0 0 8px #ffffff;
            margin-top: -12px;
            border: 2px solid #ffffff;
        }

        .home-icon-wrapper i {
            font-size: 22px;
            color: #ffffff;
            filter: none;
        }

        .active-indicator {
            width: 25px;
            height: 3px;
            background: linear-gradient(90deg, #ff007f, #00d2ff);
            border-radius: 2px;
            margin-top: 2px;
            box-shadow: 0 0 8px #00d2ff;
        }

        /* شبكة الكروت الرئيسية */
        .sections-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .main-card {
            background: #111a2e;
            border: 1px solid #1e2d4a;
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s ease, border-color 0.2s ease;
            position: relative;
        }

        .main-card:active {
            transform: scale(0.98);
        }

        /* كارت الكتيب العريض */
        .booklet-card {
            grid-column: 1 / -1;
        }

        .card-img-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0d1424;
            position: relative;
        }

        .card-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-title {
            font-size: 13px;
            font-weight: bold;
            padding: 10px 5px;
            text-align: center;
            width: 100%;
            color: #e2e8f0;
            background: #111a2e;
        }

        /* قسم المجتمعات الرسمية */
        .social-section {
            background: #111a2e;
            border: 1px solid #1e2d4a;
            border-radius: 16px;
            padding: 14px;
            text-align: center;
        }

        .social-title {
            font-size: 13px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .social-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
        }

        .wa-btn { background: #10b981; }
        .yt-btn { background: #ef4444; }
    </style>
</head>
<body>

    <!-- شريط النيون العلوي للتنقل بين الأقسام (ترفيه - الرئيسية - حسنات) -->
    <nav class="neon-navbar">
        <a href="{{ url_for('entertainment') }}" class="nav-item">
            <i class="fa-solid fa-play"></i>
            <span>ترفيه</span>
        </a>

        <a href="{{ url_for('index') }}" class="nav-item active">
            <div class="home-icon-wrapper">
                <i class="fa-solid fa-house"></i>
            </div>
            <div class="active-indicator"></div>
        </a>

        <a href="{{ url_for('hasanat') }}" class="nav-item">
            <i class="fa-solid fa-hand-holding-heart"></i>
            <span>حسنات</span>
        </a>
    </nav>

    <div class="container">

        <!-- شبكة الأقسام الرئيسية -->
        <div class="sections-grid">
            
            <!-- 1. كارت كتيب البكالوريا المميز -->
            <a href="{{ url_for('booklet') }}" class="main-card booklet-card">
                <div class="card-img-container">
                    <img src="{{ url_for('static', filename='booklet_cover.png') }}?v=99" alt="كتيب البكالوريا" class="card-cover-img">
                </div>
            </a>

            <!-- 2. الكتب الخارجية للحل -->
            <a href="{{ url_for('select_type', cat_type='external_books') }}" class="main-card">
                <div class="card-img-container">
                    <img src="{{ url_for('static', filename='external_books_cover.png') }}?v=99" alt="الكتب الخارجية للحل" class="card-cover-img">
                </div>
                <div class="card-title">الكتب الخارجية للحل</div>
            </a>

            <!-- 3. تلخيص الدروس -->
            <a href="{{ url_for('select_type', cat_type='summaries') }}" class="main-card">
                <div class="card-img-container">
                    <img src="{{ url_for('static', filename='summaries_cover.png') }}?v=99" alt="تلخيص الدروس" class="card-cover-img">
                </div>
                <div class="card-title">تلخيص الدروس</div>
            </a>

            <!-- 4. التقييمات المدرسية -->
            <a href="{{ url_for('select_type', cat_type='evaluations') }}" class="main-card">
                <div class="card-img-container">
                    <img src="{{ url_for('static', filename='evaluations_cover.png') }}?v=99" alt="التقييمات المدرسية" class="card-cover-img">
                </div>
                <div class="card-title">التقييمات المدرسية</div>
            </a>

            <!-- 5. الشروحات والمسارات -->
            <a href="{{ url_for('select_type', cat_type='lessons') }}" class="main-card">
                <div class="card-img-container">
                    <img src="{{ url_for('static', filename='lessons_cover.png') }}?v=99" alt="الشروحات والمسارات" class="card-cover-img">
                </div>
                <div class="card-title">الشروحات والمقاليات</div>
            </a>

            <!-- 6. المنصات التعليمية -->
            <a href="{{ url_for('platforms') }}" class="main-card">
                <div class="card-img-container">
                    <img src="{{ url_for('static', filename='platforms_cover.png') }}?v=99" alt="المنصات التعليمية" class="card-cover-img">
                </div>
                <div class="card-title">المنصات التعليمية</div>
            </a>

            <!-- 7. كتالوج المنصة -->
            <a href="{{ url_for('catalog') }}" class="main-card">
                <div class="card-img-container">
                    <img src="{{ url_for('static', filename='catalog_cover.png') }}?v=99" alt="كتالوج المنصة" class="card-cover-img">
                </div>
                <div class="card-title">كتالوج المنصة</div>
            </a>

        </div>

        <!-- قسم القنوات والصفحات الرسمية -->
        <div class="social-section">
            <div class="social-title"><i class="fa-solid fa-bullhorn"></i> قنواتنا بمجتمعنا الرسمية</div>
            <div class="social-links">
                <a href="{{ wa_channel_url }}" target="_blank" class="btn-social wa-btn">
                    <i class="fa-brands fa-whatsapp"></i> قناة الواتساب
                </a>
                <a href="{{ yt_channel_url }}" target="_blank" class="btn-social yt-btn">
                    <i class="fa-brands fa-youtube"></i> قناة اليوتيوب
                </a>
            </div>
        </div>

    </div>

</body>
</html>
