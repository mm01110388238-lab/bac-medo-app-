<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ cat_title }} - سهلتها لك</title>
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --sidebar-bg: #1e293b;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #0284c7;
            --sidebar-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, 'Segoe UI', sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; text-align: center; min-height: 100vh; position: relative; }
        .container { max-width: 600px; margin: 0 auto; padding-top: 70px; }

        /* الهيدر العلوي */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: 0 2px 10px var(--shadow);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .theme-toggle-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* العناوين */
        .page-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        /* كروت الاختيار الكبيرة */
        .select-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px 20px;
            margin-bottom: 20px;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 15px var(--shadow);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .select-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .icon-circle {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 30px;
        }

        .icon-blue {
            background-color: rgba(56, 189, 248, 0.12);
            color: var(--accent-color);
        }

        .icon-green {
            background-color: rgba(34, 197, 94, 0.12);
            color: #22c55e;
        }

        .card-heading {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .text-green {
            color: #22c55e;
        }

        .card-description {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <header class="top-navbar">
        <a href="/" class="btn-back"><i class="fa-solid fa-house"></i> الرئيسية</a>
        <button class="theme-toggle-btn" onclick="toggleTheme()">
            <i class="fa-solid fa-moon" id="theme-icon"></i>
        </button>
    </header>

    <!-- المحتوى الرئيسي -->
    <div class="container">
        <h1 class="page-title">{{ cat_title }}</h1>
        <p class="page-subtitle">اختر قسم المواد الذي تريد تصفحه:</p>

        <!-- كارت المواد الأساسية -->
        <a href="{{ url_for('general_subjects', cat_type=cat_type) }}" class="select-card">
            <div class="icon-circle icon-blue">
                <i class="fa-solid fa-book-open"></i>
            </div>
            <div class="card-heading">
                المواد الأساسية لجميع المسارات 🎓
            </div>
            <div class="card-description">
                تشمل المواد العامة المشتركة لكل الطلاب (اللغة العربية، التاريخ، اللغة الأجنبية...).
            </div>
        </a>

        <!-- كارت المواد التخصصية -->
        <a href="{{ url_for('specialized_tracks', cat_type=cat_type) }}" class="select-card">
            <div class="icon-circle icon-green">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div class="card-heading text-green">
                المواد التخصصية لكل مسار 🎓
            </div>
            <div class="card-description">
                المواد الخاصة بكل مسار دراسي (الطب، الهندسة وعلوم الحاسب، الأعمال، الآداب...).
            </div>
        </a>
    </div>

    <script>
        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeUI(newTheme);
        }

        function updateThemeUI(theme) {
            const icon = document.getElementById('theme-icon');
            if (theme === 'light') {
                icon.className = 'fa-solid fa-sun';
            } else {
                icon.className = 'fa-solid fa-moon';
            }
        }

        // تطبيق الثيم المحفوظ
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
        updateThemeUI(savedTheme);
    </script>
</body>
</html>
