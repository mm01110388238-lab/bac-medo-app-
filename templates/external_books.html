<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الكتب الخارجية للحل</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 40px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #111827;
            border-bottom: 1px solid #1f2937;
            margin-bottom: 25px;
        }
        .btn-back {
            background-color: #1f2937;
            color: #e5e7eb;
            border: 1px solid #374151;
            padding: 6px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-back:hover {
            background-color: #374151;
            color: #fff;
        }
        .option-card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            text-decoration: none;
            color: #fff;
        }
        .option-card:hover {
            border-color: #38bdf8;
            transform: translateY(-2px);
            color: #fff;
        }
        .option-title {
            font-size: 17px;
            font-weight: 600;
            margin: 0;
        }
        .option-desc {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 4px;
            margin-bottom: 0;
        }
        .btn-order {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            white-space: nowrap;
            text-decoration: none;
            display: inline-block;
        }
        .btn-order:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
            color: #fff;
        }
        .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background-color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #38bdf8;
            margin-left: 12px;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h5 class="m-0 font-bold">الكتب الخارجية للحل</h5>
        <a href="{{ url_for('index') }}" class="btn-back">← العودة للرئيسية</a>
    </div>

    <div class="container" style="max-width: 600px;">
        
        <!-- الأيقونة الأولى: الوصف مهم -->
        <a href="{{ url_for('external_books_info') }}" class="option-card">
            <div class="d-flex align-items-center">
                <div class="icon-box"><i class="fa-solid fa-circle-info"></i></div>
                <div>
                    <p class="option-title">الوصف مهم علشان تفهم الجزء ده</p>
                    <p class="option-desc">اضغط هنا لقراءة التفاصيل وشروط الخدمة</p>
                </div>
            </div>
            <i class="fa-solid fa-chevron-left text-muted"></i>
        </a>

        <!-- الأيقونة الثانية: فيديو التفاصيل -->
        {% if external_books_video_url %}
        <a href="{{ external_books_video_url }}" target="_blank" class="option-card">
        {% else %}
        <a href="#" onclick="alert('سيتوفر فيديو التفاصيل قريباً!'); return false;" class="option-card">
        {% endif %}
            <div class="d-flex align-items-center">
                <div class="icon-box" style="color: #ef4444;"><i class="fa-brands fa-youtube"></i></div>
                <div>
                    <p class="option-title">فيديو التفاصيل</p>
                    <p class="option-desc">شاهد الشرح المباشر على يوتيوب</p>
                </div>
            </div>
            <i class="fa-solid fa-external-link-alt text-muted"></i>
        </a>

        <!-- عرض المكتبة الموحد -->
        <div class="option-card border-amber-500/30">
            <div class="d-flex align-items-center">
                <div class="icon-box" style="color: #f59e0b;"><i class="fa-solid fa-store"></i></div>
                <div>
                    <p class="option-title">عرض المكتبة ب30 جنيه</p>
                    <p class="option-desc">7 كتب ، كتابين لكل ماده</p>
                </div>
            </div>
            <a href="https://wa.me/{{ bookstore_wa }}?text={{ ' السلام عليكم، عايز عرض المكتبة لجزء الحل (7 كتب ، كتابين لكل ماده) ب30 جنيه' | urlencode }}" target="_blank" class="btn-order" style="background: linear-gradient(135deg, #10b981, #059669);">
                <i class="fa-brands fa-whatsapp me-1"></i> اطلب الآن
            </a>
        </div>

    </div>

</body>
</html>
