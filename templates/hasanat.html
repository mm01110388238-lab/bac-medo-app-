<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d1a">
    <title>قسم حسانات - منصة السعيد</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}?v=99">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #080d1a;
            --card-bg: #111a2e;
            --text-color: #ffffff;
            --border-color: #1e2d4a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 12px; 
            padding-top: 85px;
            padding-bottom: 25px;
            min-height: 100vh; 
        }

        .container { max-width: 500px; margin: 0 auto; }

        /* شريط التنقل النيون العلوي */
        .neon-navbar {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 480px;
            height: 62px;
            background: rgba(10, 18, 38, 0.85);
            backdrop-filter: blur(12px);
            border: 1.5px solid #1a3862;
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.25);
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 1000;
            padding: 0 10px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #7dd3fc;
            font-size: 11px;
            font-weight: bold;
            gap: 3px;
            flex: 1;
            transition: all 0.3s ease;
        }

        .nav-item i { font-size: 20px; }

        .nav-item.active { color: #ffffff; }

        .active-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px #00d2ff;
            margin-top: -12px;
            border: 2px solid #ffffff;
        }

        .active-wrapper i { font-size: 22px; color: #ffffff; }

        .active-indicator {
            width: 25px;
            height: 3px;
            background: linear-gradient(90deg, #ff007f, #00d2ff);
            border-radius: 2px;
            margin-top: 2px;
            box-shadow: 0 0 8px #00d2ff;
        }

        .page-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .page-header h1 {
            font-size: 20px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .card-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card-item:active { transform: scale(0.98); }

        .card-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .card-info h3 { font-size: 15px; margin-bottom: 4px; }
        .card-info p { font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>

    <!-- شريط النيون العلوي (حسنات مفعّلة) -->
    <nav class="neon-navbar">
        <a href="{{ url_for('entertainment') }}" class="nav-item">
            <i class="fa-solid fa-play"></i>
            <span>ترفيه</span>
        </a>

        <a href="{{ url_for('index') }}" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>الرئيسية</span>
        </a>

        <a href="{{ url_for('hasanat') }}" class="nav-item active">
            <div class="active-wrapper">
                <i class="fa-solid fa-hand-holding-heart"></i>
            </div>
            <div class="active-indicator"></div>
        </a>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1><i class="fa-solid fa-kaaba"></i> قسم حسانات</h1>
        </div>

        <div class="grid-cards">
            <a href="{{ url_for('azkar_category', category='sabah') }}" class="card-item">
                <div class="card-icon"><i class="fa-solid fa-sun"></i></div>
                <div class="card-info">
                    <h3>أذكار الصباح</h3>
                    <p>حصن نفسك مع بداية يومك</p>
                </div>
            </a>

            <a href="{{ url_for('azkar_category', category='masea') }}" class="card-item">
                <div class="card-icon"><i class="fa-solid fa-moon"></i></div>
                <div class="card-info">
                    <h3>أذكار المساء</h3>
                    <p>أذكار وطمأنينة لنهاية اليوم</p>
                </div>
            </a>

            <a href="{{ url_for('quran') }}" class="card-item">
                <div class="card-icon"><i class="fa-solid fa-book-quran"></i></div>
                <div class="card-info">
                    <h3>القرآن الكريم</h3>
                    <p>تلاوة واستماع</p>
                </div>
            </a>

            <a href="{{ url_for('nawawi') }}" class="card-item">
                <div class="card-icon"><i class="fa-solid fa-scroll"></i></div>
                <div class="card-info">
                    <h3>الأربعين النووية</h3>
                    <p>أحاديث سَيِّدِ المُرْسَلِينَ ومعانيها</p>
                </div>
            </a>

            <a href="{{ url_for('prayer_times') }}" class="card-item">
                <div class="card-icon"><i class="fa-solid fa-clock"></i></div>
                <div class="card-info">
                    <h3>مواقيت الصلاة</h3>
                    <p>مواعيد الأذان حسب موقعك</p>
                </div>
            </a>

            <a href="{{ url_for('sebha') }}" class="card-item">
                <div class="card-icon"><i class="fa-solid fa-circle-dot"></i></div>
                <div class="card-info">
                    <h3>السبحة الإلكترونية</h3>
                    <p>عداد الاستغفار والتسبيح</p>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
