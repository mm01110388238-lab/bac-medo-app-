<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - سهلتها لك</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { 
            background-color: #121212; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .card { 
            background: #1e1e1e; 
            border: 1px solid #333; 
            border-radius: 14px; 
            padding: 30px 20px; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
            text-align: center; 
        }
        .card h2 { color: #00ffcc; font-size: 22px; margin-bottom: 25px; }
        .input-box { width: 100%; padding: 14px; margin-bottom: 15px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 15px; outline: none; }
        .input-box:focus { border-color: #00ffcc; }
        .btn { width: 100%; padding: 14px; background: #00ffcc; border: none; color: #000; font-weight: bold; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 5px; }
        .link-text { margin-top: 20px; font-size: 14px; color: #ccc; }
        .link-text a { color: #00ffcc; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>إنشاء حساب جديد</h2>
        <form method="POST">
            <input type="text" name="name" class="input-box" placeholder="الاسم بالكامل" required>
            <input type="text" name="identifier" class="input-box" placeholder="البريد الإلكتروني أو رقم الهاتف" required>
            <input type="password" name="password" class="input-box" placeholder="كلمة المرور" required>
            <button type="submit" class="btn">تسجيل حساب</button>
        </form>
        <p class="link-text">لديك حساب بالفعل؟ <a href="/login">سجل دخولك</a></p>
    </div>
</body>
</html>
