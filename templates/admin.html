<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 16px; text-align: right; }
        input, select { width: 100%; padding: 12px; margin: 8px 0 16px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        .btn-submit { display: block; width: 100%; padding: 14px; background: #16a34a; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-back { display: inline-block; background: #64748b; color: white; padding: 8px 20px; border-radius: 8px; text-decoration: none; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: #38bdf8; text-align: center;">⚙️ لوحة تحكم الأدمن</h1>
        
        <form method="POST">
            <label>اختر قسم المحتوى:</label>
            <select name="category" id="category" onchange="toggleTrackSelect()">
                <option value="book">📚 كتاب / مذكرة (PDF)</option>
                <option value="platform">🌐 منصة تعليمية</option>
                <option value="lesson">📺 شرح / مراجعة (حسب التخصص)</option>
            </select>

            <div id="track-div" style="display: none;">
                <label>اختر المسار والتخصص:</label>
                <select name="track">
                    {% for key, name in tracks.items() %}
                        <option value="{{ key }}">{{ name }}</option>
                    {% endfor %}
                </select>
            </div>

            <label>العنوان / الاسم:</label>
            <input type="text" name="title" placeholder="مثال: ملخص الفيزياء الفصل الأول" required>

            <label>الرابط المباشر (PDF / فيديو / موقع):</label>
            <input type="url" name="link" placeholder="https://..." required>

            <button type="submit" class="btn-submit">➕ إضافة المحتوى</button>
        </form>

        <div style="text-align: center;">
            <a href="/" class="btn-back">🏠 العودة للموقع الرئيسي</a>
        </div>
    </div>

    <script>
        function toggleTrackSelect() {
            var cat = document.getElementById('category').value;
            document.getElementById('track-div').style.display = (cat === 'lesson') ? 'block' : 'none';
        }
    </script>
</body>
</html>
